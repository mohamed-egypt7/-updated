<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">تحسينات جارية - عودة قريبًا</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        /* زر تبديل اللغة */
        .lang-switch {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #262626;
            border: 1px solid #383838;
            color: #d1d5db;
            padding: 4px 12px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        [dir="ltr"] .lang-switch {
            left: auto;
            right: 20px;
        }

        .lang-switch:hover {
            background-color: #333333;
            color: #ffffff;
            border-color: #6366f1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        [dir="ltr"] .status-dot {
            margin-left: 0;
            margin-right: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background-color: #221e16;
            border: 1px solid #3d2f17;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            margin-top: 10px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        p {
            font-size: 14px;
            line-height: 1.7;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: #262626;
            width: 100%;
            margin-bottom: 24px;
        }

        /* زر إعادة المحاولة والشورت لينك */
        .reload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: #262626;
            border: 1px solid #383838;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .reload-btn:hover {
            background-color: #333333;
            border-color: #6366f1;
            color: #818cf8;
        }

        .reload-btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- زر التبديل بين العربية والإنجليزي -->
        <button class="lang-switch" onclick="toggleLanguage()" id="langBtnText">English</button>

        <div class="badge">
            <span class="status-dot"></span>
            <span id="badgeText">تحسينات مؤقتة</span>
        </div>

        <h1 id="headingText">نعمل على تحديث النظام</h1>
        
        <p id="descText">
            نقوم حالياً بإجراء بعض التطويرات. عادة ما تستغرق العملية من <strong>30 إلى 60 دقيقة</strong> لنعود للعمل بصورة طبيعية.
        </p>

        <div class="divider"></div>

        <!-- زر إعادة المحاولة والشورت لينك -->
        <button class="reload-btn" onclick="retryOriginLink()">
            <i class="fas fa-redo-alt"></i> <span id="btnTextContent">Try Again</span>
        </button>

        <div class="footer-note" id="footerText">
            شكراً لتفهمك وحسن انتظارك.
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                dir: "rtl",
                title: "تحسينات جارية - عودة قريبًا",
                badge: "تحسينات مؤقتة",
                heading: "نعمل على تحديث النظام",
                description: "نقوم حالياً بإجراء بعض التطويرات. عادة ما تستغرق العملية من <strong>30 إلى 60 دقيقة</strong> لنعود للعمل بصورة طبيعية.",
                btnText: "Try Again",
                footer: "شكراً لتفهمك وحسن انتظارك.",
                langBtn: "English"
            },
            en: {
                dir: "ltr",
                title: "System Maintenance - Back Soon",
                badge: "Temporary Maintenance",
                heading: "System Maintenance",
                description: "We are currently performing updates. This process usually takes <strong>30 to 60 minutes</strong> to get back to normal.",
                btnText: "Try Again",
                footer: "Thank you for your patience and understanding.",
                langBtn: "العربية"
            }
        };

        let currentLang = "ar";

        function toggleLanguage() {
            currentLang = currentLang === "ar" ? "en" : "ar";
            const t = translations[currentLang];

            document.getElementById("htmlRoot").setAttribute("dir", t.dir);
            document.getElementById("htmlRoot").setAttribute("lang", currentLang);
            document.getElementById("pageTitle").innerText = t.title;

            document.getElementById("badgeText").innerText = t.badge;
            document.getElementById("headingText").innerText = t.heading;
            document.getElementById("descText").innerHTML = t.description;
            document.getElementById("btnTextContent").innerText = t.btnText;
            document.getElementById("footerText").innerText = t.footer;
            document.getElementById("langBtnText").innerText = t.langBtn;
        }

        // تسجيل رابط الشورت لينك المصدر فور الدخول (سواء من الـ Referrer أو Query Params مثل ?to=)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('to') || urlParams.get('redirect') || document.referrer;
            
            if (targetUrl && targetUrl !== window.location.href && !sessionStorage.getItem('short_link_origin')) {
                sessionStorage.setItem('short_link_origin', targetUrl);
            }
        };

        function retryOriginLink() {
            const originLink = sessionStorage.getItem('short_link_origin') || document.referrer;
            
            if (originLink && originLink !== window.location.href) {
                window.location.href = originLink;
            } else {
                window.location.reload();
            }
        }
    </script>

</body>
</html>
