<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحسينات جارية - عودة قريبًا</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background-color: #221e16;
            border: 1px solid #3d2f17;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        p {
            font-size: 14px;
            line-height: 1.7;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: #262626;
            width: 100%;
            margin-bottom: 20px;
        }

        .footer-note {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">
            <span class="status-dot"></span>
            تحسينات مؤقتة
        </div>

        <h1>نعمل على تحديث النظام</h1>
        
        <p>
            نقوم حالياً بإجراء بعض المراجعات التقنية. عادة ما تستغرق هذه العملية من <strong>5 إلى 15 دقيقة</strong> لنعود للعمل بصورة طبيعية.
        </p>

        <div class="divider"></div>

        <div class="footer-note">
            شكراً لتفهمك وحسن انتظارك.
        </div>
    </div>

</body>
</html>
