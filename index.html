<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحديث والصيانة</title>
    
    <!-- مكتبات التنسيق والخطوط -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #090d16;
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 20px;
        }

        /* خلفية متوهجة متحركة */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.2) 0%, rgba(147, 51, 234, 0.08) 40%, transparent 75%);
            z-index: -1;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
        }

        /* تصميم الزجاج الشفاف */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: panelEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes panelEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* أنيميشن الطفو للأيقونة */
        .float-anim {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* أنيميشن الدوران للترس */
        .spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="glass-panel w-full max-w-md p-8 text-center">
        <!-- أيقونة الصيانة المتحركة -->
        <div class="w-24 h-24 bg-gradient-to-tr from-amber-500 to-orange-600 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-2xl shadow-orange-500/40 float-anim">
            <i class="fas fa-tools text-4xl text-white spin-slow"></i>
        </div>

        <h1 class="text-2xl font-extrabold mb-2 tracking-wide">نعمل على تحديث الموقع</h1>
        <p class="text-gray-300 text-sm mb-6 leading-relaxed">
            نقوم حالياً بإجراء بعض التطويرات والتحسينات، وعادة ما تستغرق هذه العملية من <span class="text-emerald-400 font-bold">5 إلى 15 دقيقة</span> لنعود للعمل بكامل طاقتنا! 🚀
        </p>

        <!-- تنبيه هادئ -->
        <div class="p-4 bg-white/5 border border-white/10 rounded-2xl text-xs text-gray-400 flex items-center justify-center gap-2">
            <i class="fas fa-shield-alt text-indigo-400"></i>
            <span>شكراً لصبرك، نعود لكم فور الانتهاء.</span>
        </div>
    </div>

</body>
</html>
